name: Date pages

# Moves a page's lastmod in sitemap.xml when a push changes its text, so nobody has to.
on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: commits-to-main
  cancel-in-progress: false

jobs:
  date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Each page is dated by the last commit that changed it.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/build_pages.py
      - name: Commit if changed
        run: |
          git add sitemap.xml
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Date pages in the sitemap"
          git pull --rebase
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
