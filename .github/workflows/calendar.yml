name: Update calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Reads the calendars through the Google Calendar API with a read-only token, because
      # the public feeds leave out the event metadata. The secret is the token's whole JSON.
      - run: python scripts/update_calendar.py events.json
        env:
          LCCC_GOOGLE_TOKEN: ${{ secrets.LCCC_GOOGLE_CALENDAR_READ_TOKEN }}
      # The Event data, each club tournament's page, and the sitemap come from events.json.
      - run: python scripts/build_pages.py
      - name: Commit if changed
        run: |
          git add -A events.json events sitemap.xml
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update calendar events"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
